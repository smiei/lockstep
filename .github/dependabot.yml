# Keeps dependencies current: Dependabot opens pull requests, the CI workflow
# (.github/workflows/ci.yml) tests each one, and a maintainer merges.
# Security fixes arrive as their own pull requests at once, whatever the
# schedule (enable "Dependabot security updates" in the repository settings).
#
# Version updates are minor and patch only, grouped into one pull request per
# ecosystem. Major versions (Prisma 7, a new Node LTS, ...) need code changes
# and a decision, so they are planned by hand instead of arriving weekly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # The image's base (node:<LTS>-alpine). The tag already moves with Node's
  # patch releases; a new major is a deliberate switch to the next LTS (odd
  # majors like 25 are not LTS at all), so majors are ignored here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "docker"
