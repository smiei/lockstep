# Keeps dependencies current: Dependabot opens pull requests, the CI workflow
# (.github/workflows/ci.yml) tests each one, and a maintainer merges.
# Security fixes arrive as their own pull requests at once, whatever the
# schedule (enable "Dependabot security updates" in the repository settings).
#
# Minor and patch updates come grouped, one pull request per ecosystem.
# Major versions (Next, Prisma, React, ...) arrive one by one, because they
# usually need code changes and are reviewed and tested by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # The image's base (node:<LTS>-alpine). Only new LTS majors need a decision;
  # the alpine tag itself already moves with Node's patch releases.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "docker"
