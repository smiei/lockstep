# Tests, lint and a production build for every pull request (Dependabot's
# included) and every push to master: a dependency update is merged only
# once this is green. The lint step fails on any lint error.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The build reads the Run table while prerendering, so it needs a
      # migrated throwaway database, as in the Dockerfile.
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test

      - name: Lint
        run: npx eslint .

      - run: npm run build
