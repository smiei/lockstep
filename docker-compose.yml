services:
  lockstep:
    build: .
    # Tag the built image with the Docker Hub name so `docker compose build`
    # (or `up --build`) produces exactly the image you push. Without this,
    # compose names it "<project>-<service>" and `docker push
    # gloryy/lockstep:latest` would push a stale, separately-tagged
    # image ("Layer already exists" for everything).
    image: gloryy/lockstep:latest
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/db
      - ./data:/app/data:ro
      # Sprites live outside the image (copyright) - mount the local copies.
      - ./public/pokemon-sprites:/app/public/pokemon-sprites
      - ./public/ball-sprites:/app/public/ball-sprites
      - ./public/badges:/app/public/badges
      # Writable on purpose: the entrypoint downloads missing trainer pictures
      # from Showdown into it (scripts/download-trainers.mjs). Your own files
      # here are never overwritten.
      - ./public/trainers:/app/public/trainers
      # Optional: drop an icon.svg in here to replace the app icon on your own
      # instance. Gitignored and dockerignored, so it never reaches the repo
      # or the published image.
      - ./branding-local:/app/branding:ro
    environment:
      - DATABASE_URL=file:/app/db/nuzlocke.db
    restart: unless-stopped

volumes:
  db-data:
