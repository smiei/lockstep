<!doctype html>
<!--
  The Windows app's waiting page (windows/Lockstep.cs fills the {{...}} slots
  and writes it to %LOCALAPPDATA%\Lockstep\wait.html). It opens at once on the
  first start, while the tray downloads the images, and switches to Lockstep
  by itself: an image probe against the server succeeds as soon as it serves
  files (an image may load from a file:// page without CORS). It reloads
  itself every few seconds to pick up the step the tray writes in.
  Offline on purpose: system fonts, inline logo, no requests but the probe.
-->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<style>
  :root {
    --canvas: #ebefea; --panel: #ffffff; --line: #c9d6cd; --ink: #1a1f1c; --muted: #46524b;
    --accent: #0f3d30; --done: #2f6b4f; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #0e1311; --panel: #151b18; --line: #2b3530; --ink: #e4ebe6; --muted: #a9b8af;
      --accent: #9fd1b7; --done: #8fc9aa; --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--canvas); color: var(--ink);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 34rem; text-align: center; }
  .logo { width: 88px; height: 88px; margin: 0 auto 20px; }
  .logo svg { width: 100%; height: 100%; display: block; }
  h1 { font-size: 1.9rem; letter-spacing: -0.02em; margin: 0 0 10px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 auto 22px; max-width: 30rem; }
  ol {
    list-style: none; margin: 0 auto; padding: 12px 18px; width: fit-content; text-align: left;
    background: var(--panel); border: 1px solid var(--line); outline: 1px solid var(--line); outline-offset: 3px;
    font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 0.95rem;
  }
  li { display: flex; align-items: center; gap: 12px; padding: 4px 0; color: var(--muted); }
  li .mark { position: relative; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
  /* done: a filled disc with a tick; current: a ring that pulses */
  li.done { color: var(--ink); }
  li.done .mark { background: var(--done); border-color: var(--done); }
  li.done .mark::after {
    content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
    border: solid var(--panel); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  li.current { color: var(--ink); font-weight: 600; }
  li.current .mark { border: 3px solid var(--accent); }
  @media (prefers-reduced-motion: no-preference) {
    li.current .mark { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
  }
  .fail h1 { color: var(--danger); }
  .fail ol { display: none; }
  .note { font-size: 0.85rem; margin-top: 22px; }
  code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 0.85em; word-break: break-all; color: var(--ink); }
</style>
</head>
<body>
<main class="{{STATE}}">
  <div class="logo" aria-hidden="true">{{LOGO}}</div>
  <h1>{{TITLE}}</h1>
  <p>{{TEXT}}</p>
  <ol aria-label="{{STEPS_LABEL}}">{{STEPS}}</ol>
  <p class="note">{{NOTE}}</p>
</main>
<script>
  (function () {
    var target = "http://localhost:{{PORT}}/";
    var failed = "{{STATE}}" === "fail";
    function probe() {
      var img = new Image();
      img.onload = function () { location.replace(target); };
      img.src = target + "icons/favicon-32.png?t=" + Date.now();
    }
    probe();
    setInterval(probe, 2000);
    // Pick up the step (or the failure) the tray writes into this file.
    if (!failed) setTimeout(function () { location.reload(); }, 5000);
  })();
</script>
</body>
</html>
