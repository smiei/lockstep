<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Lockstep's mark: a collection label - the double-ruled frame a museum
       puts under a specimen - holding two linked dots, the two catches of one
       route that live and die together. It is the redesign's signature
       element (globals.css .specimen-label) drawn as a logo. Deliberately
       abstract - no Pokemon or Poke Ball imagery, since the repo and the
       public Docker image must stay free of copyrighted artwork.

       Also the favicon and the rail's logo (HeaderTitle loads /icons/icon.svg):
       scripts/generate-icons.mjs rasterises this file into the PNG sizes the
       manifest and iOS need, so there is one source of truth. The tile is the
       shell green (#0f3d30), the same colour the generator uses behind the
       maskable and Apple insets, so Android's crop shows no seam - and on the
       green rail itself only the pale mark is visible.

       Rendered by librsvg (via sharp), not a browser: SVG 1.1 presentation
       attributes only - no CSS, no text, no filters, no currentColor. -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0f3d30" />
  <rect x="72" y="150" width="368" height="212" rx="20" fill="none" stroke="#dcebe1" stroke-width="26" />
  <rect x="104" y="182" width="304" height="148" rx="6" fill="none" stroke="#dcebe1" stroke-width="8" />
  <rect x="190" y="244" width="132" height="24" fill="#ffffff" />
  <circle cx="190" cy="256" r="44" fill="#ffffff" />
  <circle cx="322" cy="256" r="44" fill="#ffffff" />
</svg>
